<section class="weather" aria-labelledby="weather-title">
  <div class="weather__wrapper">
    <h1 id="weather-title" class="weather__title">Current weather</h1>
    @if (errorMessage()) {
      <app-weather-error [message]="errorMessage()" />
    }
    <app-weather-form
      (weatherChange)="weather.set($event)"
      (errorChange)="errorMessage.set($event)"
    />
    <app-weather-details [weather]="weather()" />
  </div>
</section>
