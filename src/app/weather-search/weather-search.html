<section class="weather" aria-labelledby="weather-title">
  <div class="weather__wrapper">
    <h1 id="weather-title" class="weather__title">Weather forecast</h1>
    <label for="city">City</label>
    <input id="city" name="city" type="search" placeholder="Enter the name of the place" autocomplete="address-level2" required />
    <button type="button">Get a forecast</button>
  </div>
</section>
